<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>角色资源管理</title>
<style>body{font:16px system-ui;max-width:1100px;margin:auto;padding:24px;background:#f5f5f2;color:#202622}section,article{background:white;padding:20px;margin:16px 0;border-radius:12px}button,input,textarea{font:inherit;padding:10px;margin:5px;max-width:90%}button{cursor:pointer}p{overflow-wrap:anywhere}iframe{width:100%;height:800px;border:0}small{color:#59645c}#warning{color:#9e3425}textarea{display:block;width:90%}</style>
<h1>单角色资源流水线</h1><p>一次上传一张照片。后台串行制作，效果最终由你确认。</p>
<section><label>管理员访问凭据 <input id="token" type="password" autocomplete="off"></label><button id="connect">连接／刷新</button><small>凭据仅保存在本页内存，不写入浏览器存储。</small></section>
<section><input id="file" type="file" accept="image/png,image/jpeg,image/webp"><button id="submit">创建角色并处理</button><p>PNG、JPEG、WebP，单张≤12MiB；仅清晰、五官完整的单人正脸。</p></section>
<p id="warning" role="alert"></p><main id="jobs"></main><section id="viewer" hidden><h2>动画审查</h2><iframe title="动画预览" sandbox="allow-scripts"></iframe></section>
<script>
const $=id=>document.getElementById(id);let pendingKey=crypto.randomUUID();let refreshing=false;
const labels={preflight:'原图检查',normalize:'AI规范化',locate:'本地五官定位','mouth-half':'嘴半张素材','mouth-open':'嘴张开素材','eyes-half':'眼半闭素材','eyes-closed':'眼闭合素材',assemble:'局部动画组装',audit:'像素与口型检查',export:'预览导出',browser:'浏览器技术检查',finalize:'打包'};
const statuses={queued:'排队中',running:'处理中',paused:'已暂停',awaiting_review:'等待你审查',approved:'你已通过',rejected:'你未通过'};
async function api(path,body){const res=await fetch(path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+$('token').value,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});if(!res.ok)throw new Error((await res.json()).error);return res;}
function warn(e){$('warning').textContent=e.message||String(e);}
function el(tag,text){const n=document.createElement(tag);n.textContent=text;return n;}
async function refresh(){if(refreshing)return;refreshing=true;try{const {jobs}=await(await api('/api/roles')).json();$('jobs').replaceChildren();for(const job of jobs){const card=el('article','');card.append(el('h2',job.fileName),el('small',job.id+' · '+(job.mode==='fixture'?'缓存回放，非新生图':'真实流程')),el('p',statuses[job.status]+' / '+labels[job.stage]));if(job.error)card.append(el('p',job.error));card.append(el('p','已完成：'+Object.keys(job.completed).map(s=>labels[s]).join(' → ')));if(job.status==='paused'){const b=el('button','检查后继续（不自动重试未知付费请求）');b.onclick=()=>api('/api/roles/'+job.id+'/resume',{}).then(refresh).catch(warn);card.append(b);}if(job.completed.finalize){const b=el('button','查看动画');b.onclick=async()=>{try{$('viewer').hidden=false;document.querySelector('iframe').srcdoc=await(await api('/api/roles/'+job.id+'/preview')).text();$('viewer').scrollIntoView();}catch(e){warn(e)}};card.append(b);const d=el('button','下载资源包');d.onclick=async()=>{try{const url=URL.createObjectURL(await(await api('/api/roles/'+job.id+'/archive')).blob());const a=el('a','');a.href=url;a.download=job.id+'.zip';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}catch(e){warn(e)}};card.append(d);}if(job.status==='awaiting_review'){const note=el('textarea','');note.placeholder='记录流畅度、自然度、接缝等问题';note.maxLength=2000;card.append(note);for(const [decision,text]of [['approved','通过'],['rejected','不通过']]){const b=el('button',text);b.onclick=()=>api('/api/roles/'+job.id+'/review',{decision,note:note.value,resourceHash:job.resourceHash}).then(refresh).catch(warn);card.append(b);}}if(job.review)card.append(el('p','审查备注：'+job.review.note));$('jobs').append(card);}}catch(e){warn(e)}finally{refreshing=false;}}
$('connect').onclick=refresh;$('file').onchange=()=>{pendingKey=crypto.randomUUID()};
$('submit').onclick=async()=>{const f=$('file').files[0];if(!f)return warn('请选择一张图片');if(f.size>12*1024*1024)return warn('图片超过12MiB');$('submit').disabled=true;try{const base64=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result.split(',')[1]);r.onerror=no;r.readAsDataURL(f)});await api('/api/roles',{name:f.name,base64,key:pendingKey});$('warning').textContent='已提交，后台处理不依赖页面保持打开。';await refresh();}catch(e){warn(e)}finally{$('submit').disabled=false;}};
setInterval(()=>{if($('token').value&&!document.querySelector('textarea:focus'))refresh()},4000);
</script></html>
